<!doctype html>
<html><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<style>
/* Defaults are deliberately low-priority: a document's own CSS can override them. */
@layer preview-defaults {
  :root { color-scheme: light; font: 15px/1.65 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #26313b; background: #fff; }
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; padding: clamp(16px, 3vw, 32px); overflow-wrap: anywhere; }
  h1, h2, h3, h4, h5, h6 { color: #17212b; line-height: 1.25; margin: 1.5em 0 .65em; font-weight: 650; }
  h1 { font-size: 2em; } h2 { font-size: 1.5em; } h3 { font-size: 1.2em; }
  body > :first-child { margin-top: 0; } body > :last-child { margin-bottom: 0; }
  p, ul, ol, pre, table, blockquote, figure { margin: 0 0 1.2em; }
  ul, ol { padding-left: 1.6em; } li + li { margin-top: .3em; }
  table { border-collapse: collapse; width: 100%; font-size: .93em; font-variant-numeric: tabular-nums; }
  th, td { padding: 10px 12px; border: 1px solid #dce2e8; text-align: left; vertical-align: top; }
  th { font-weight: 650; color: #17212b; background: #edf1f5; }
  tbody tr:nth-child(even) { background: #f8fafc; }
  [align="right"] { text-align: right; } [align="center"] { text-align: center; }
  caption { text-align: left; font-weight: 600; padding-bottom: .7em; }
  code, pre { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: .88em; }
  code { padding: .15em .35em; border-radius: 4px; background: #eef2f6; }
  pre { overflow: auto; padding: 16px; border: 1px solid #dce2e8; border-radius: 8px; background: #f6f8fa; }
  pre code { padding: 0; background: transparent; font-size: inherit; }
  blockquote { border-left: 3px solid #a6b9ce; padding: .5em 1em; color: #526171; background: #f6f8fa; }
  blockquote > :last-child { margin-bottom: 0; }
  hr { border: 0; border-top: 1px solid #dce2e8; margin: 1.5em 0; }
  img, svg { max-width: 100%; height: auto; }
}
</style>
<script src="/vendor/purify-classic.js" defer></script><script src="/preview.js" defer></script>
</head><body></body></html>
